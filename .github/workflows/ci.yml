name: CI

on: push

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: swiftlint lint --strict --reporter github-actions-logging

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: swift test
