# An explicit allow-list: only rules that catch outright mistakes, plus formatting rules
# that pin the code to a single layout. Rules that flag code which is merely a matter of
# taste (force unwraps, naming, complexity metrics, …) are deliberately left out.
only_rules:
  # Correctness — code that is wrong or dead, not just unidiomatic
  - blanket_disable_command
  - compiler_protocol_init
  - deployment_target
  - discarded_notification_center_observer
  - duplicate_conditions
  - duplicate_enum_cases
  - duplicate_imports
  - duplicated_key_in_dictionary_literal
  - dynamic_inline
  - identical_operands
  - invalid_swiftlint_command
  - invisible_character
  - notification_center_detachment
  - ns_number_init_as_function_reference
  - nsobject_prefer_isequal
  - orphaned_doc_comment
  - overridden_super_call
  - private_unit_test
  - prohibited_super_call
  - self_in_property_initialization
  - superfluous_disable_command
  - unused_control_flow_label
  - unused_setter_value
  - valid_ibinspectable

  # Formatting — whitespace, braces, punctuation and line layout
  - attribute_name_spacing
  - closing_brace
  - closure_end_indentation
  - closure_parameter_position
  - closure_spacing
  - collection_alignment
  - colon
  - comma
  - comma_inheritance
  - comment_spacing
  - computed_accessors_order
  - control_statement
  - empty_parentheses_with_trailing_closure
  - function_name_whitespace
  - indentation_width
  - leading_whitespace
  - line_length
  - literal_expression_end_indentation
  - mark
  - modifier_order
  - multiline_arguments
  - multiline_arguments_brackets
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiline_parameters_brackets
  - no_space_in_method_call
  - number_separator
  - opening_brace
  - operator_usage_whitespace
  - period_spacing
  - protocol_property_accessors_order
  - return_arrow_whitespace
  - sorted_imports
  - statement_position
  - switch_case_alignment
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - vertical_parameter_alignment
  - vertical_parameter_alignment_on_call
  - vertical_whitespace
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

included:
  - Package.swift
  - Sources
  - Tests

deployment_target:
  macOS_deployment_target: "15.0"

line_length:
  warning: 120
  error: 120
